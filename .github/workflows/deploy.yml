name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync/SSH (avec retries)
        run: |
          for attempt in 1 2 3 4 5; do
            echo "::group::Tentative $attempt/5"
            if rsync -avzr \
              -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o ConnectTimeout=15 -o StrictHostKeyChecking=yes" \
              --exclude=.git/ --exclude=.github/ --exclude=.gitignore --exclude=node_modules/ \
              --exclude=.env --exclude='.env.*' --exclude=.htaccess --exclude=.htaccess.dist \
              --exclude=cache/ --exclude=.DS_Store --exclude=docker/ --exclude=database/ \
              --exclude=README.md --exclude=License --exclude=package.json --exclude=package-lock.json \
              --exclude=.prettierignore \
              ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"; then
              echo "::endgroup::"
              echo "Déploiement réussi (tentative $attempt)"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 5 ]; then
              echo "Échec après 5 tentatives"
              exit 1
            fi
            sleep 20
          done
